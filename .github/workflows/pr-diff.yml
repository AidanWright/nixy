name: Closure diff

on:
  pull_request:

concurrency:
  group: pr-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    # A pull request from a fork gets a read-only token and cannot post the
    # comment, so it is skipped rather than failed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: aidanwright
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build both closures
        id: build
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          target='checks.aarch64-linux.nixos-biggy'
          base=$(nix build --no-link --print-out-paths "git+file://$PWD?rev=$BASE#$target")
          head=$(nix build --no-link --print-out-paths ".#$target")
          {
            echo 'diff<<EOF'
            nix store diff-closures "$base" "$head"
            echo EOF
          } >>"$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: closure-diff
          message: |
            ### Package changes on `biggy`

            ```
            ${{ steps.build.outputs.diff }}
            ```
