# Comments on a pull request with the packages it adds, drops, or changes in
# each host closure, so a lock bump shows what it actually moves.
#
# Only host closures are diffed. checks.nix names those after the configuration
# they come from, while the rest of the checks are lint derivations whose
# contents say nothing useful.
name: Closure diff

on:
  pull_request:

concurrency:
  group: pr-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    # A pull request from a fork gets a read-only token and cannot post the
    # comment, so it is skipped rather than failed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: aidanwright
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Diff every closure this runner can build
        id: build
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SYSTEM: aarch64-linux
        run: |
          set -o pipefail

          base="git+file://$PWD?rev=$BASE"

          closures() {
            nix eval --json "$1#checks.$SYSTEM" --apply builtins.attrNames \
              | jq -r '.[]' \
              | grep -E '^(nixos|darwin|home)-' \
              | sort
          }

          # A host added or removed by the pull request has nothing to compare
          # against, so only the closures both sides define are diffed.
          comm -12 <(closures "$base") <(closures .) >/tmp/names

          : >/tmp/diff
          while read -r name; do
            before=$(nix build --no-link --print-out-paths "$base#checks.$SYSTEM.$name")
            after=$(nix build --no-link --print-out-paths ".#checks.$SYSTEM.$name")
            {
              echo "### $name"
              echo '```'
              nix store diff-closures "$before" "$after"
              echo '```'
            } >>/tmp/diff
          done </tmp/names

          {
            echo 'diff<<GITHUB_OUTPUT_EOF'
            cat /tmp/diff
            echo GITHUB_OUTPUT_EOF
          } >>"$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: closure-diff
          message: |
            ## Package changes

            ${{ steps.build.outputs.diff }}
